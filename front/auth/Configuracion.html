<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Configuración — SahlaFix</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/Home.css">
  <link rel="stylesheet" href="../css/Configuracion.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="logo">SahlaFix</div>
      <div class="config-header-title">Configuración</div>
    </div>
  </header>

  <div class="container">

    <!-- Avatar -->
    <div class="config-avatar-section">
      <div class="config-avatar" id="config-avatar"></div>
      <div class="config-avatar-info">
        <div class="config-avatar-name" id="config-name-display">Cargando...</div>
        <div class="config-avatar-role">Técnico</div>
      </div>
    </div>

    <!-- Formulario -->
    <div class="config-card">
      <div class="config-card-title">Información personal</div>

      <div class="config-field">
        <label for="field-name">Nombre completo</label>
        <input type="text" id="field-name" placeholder="Tu nombre">
      </div>

      <div class="config-field">
        <label for="field-phone">Teléfono</label>
        <input type="tel" id="field-phone" placeholder="+213 ...">
      </div>

      <div class="config-field">
        <label for="field-city">Ciudad</label>
        <input type="text" id="field-city" placeholder="Tu ciudad">
      </div>

      <div class="config-field">
        <label for="field-wilaya">Wilaya</label>
        <select id="field-wilaya">
          <option value="">Selecciona wilaya</option>
          <option>Adrar</option><option>Chlef</option><option>Laghouat</option>
          <option>Oum El Bouaghi</option><option>Batna</option><option>Béjaïa</option>
          <option>Biskra</option><option>Béchar</option><option>Blida</option>
          <option>Bouira</option><option>Tamanrasset</option><option>Tébessa</option>
          <option>Tlemcen</option><option>Tiaret</option><option>Tizi Ouzou</option>
          <option>Argel</option><option>Djelfa</option><option>Jijel</option>
          <option>Sétif</option><option>Saïda</option><option>Skikda</option>
          <option>Sidi Bel Abbès</option><option>Annaba</option><option>Guelma</option>
          <option>Constantine</option><option>Médéa</option><option>Mostaganem</option>
          <option>M'Sila</option><option>Mascara</option><option>Ouargla</option>
          <option>Orán</option><option>El Bayadh</option><option>Illizi</option>
          <option>Bordj Bou Arréridj</option><option>Boumerdès</option><option>El Tarf</option>
          <option>Tinduf</option><option>Tissemsilt</option><option>El Oued</option>
          <option>Khenchela</option><option>Souk Ahras</option><option>Tipaza</option>
          <option>Mila</option><option>Aïn Defla</option><option>Naâma</option>
          <option>Aïn Témouchent</option><option>Ghardaïa</option><option>Relizane</option>
        </select>
      </div>

      <div class="config-field">
        <label for="field-desc">Descripción</label>
        <textarea id="field-desc" rows="3" placeholder="Cuéntanos sobre ti y tus servicios..."></textarea>
      </div>

      <!-- PHOTO UPLOAD — rediseñado -->
      <div class="config-field">
        <label>Foto de perfil</label>
        <div class="photo-upload-wrapper" id="photo-upload-wrapper">
          <input type="file" id="field-photo" accept="image/*" hidden>
          <div class="photo-upload-preview" id="photo-preview">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/>
              <circle cx="12" cy="13" r="3"/>
              <path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/>
            </svg>
          </div>
          <div class="photo-upload-content">
            <div class="photo-upload-label" id="photo-label">Subir foto</div>
            <div class="photo-upload-hint">JPG, PNG — máx. 5 MB</div>
          </div>
          <button type="button" class="photo-upload-btn" id="photo-btn" onclick="document.getElementById('field-photo').click()">
            Elegir
          </button>
        </div>
      </div>
    </div>

    <!-- Botón guardar -->
    <div class="config-btn-wrap">
      <button class="config-btn" id="save-btn">Guardar cambios</button>
    </div>

    <!-- Toast -->
    <div class="config-toast" id="toast"></div>

  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <a href="Home.html" class="nav-item" style="text-decoration:none">
      <svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><polyline points="9 21 9 12 15 12 15 21"/></svg>
      <span class="nav-label">Inicio</span>
    </a>
    <a href="../auth/buscador.html" class="nav-item" style="text-decoration:none">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span class="nav-label">Buscar</span>
    </a>
         <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span class="nav-label">Cuenta</span>
        </div>
    <div class="nav-item active">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <span class="nav-label">Ajustes</span>
    </div>
    <a href="mapa.html" class="nav-item" style="text-decoration:none">
      <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
      <span class="nav-label">Mapa</span>
    </a>
    <a href="Chats.html" class="nav-item" style="text-decoration:none">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      <span class="nav-label">Chats</span>
    </a>
  </div>
  <script src="../js/Configuracion.js"></script>
</body>
</html>
