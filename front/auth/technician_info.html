<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Perfil Técnico — SahlaFix</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../assests/logo.png">
  <link rel="stylesheet" href="../css/technician_info.css">
  <link rel="stylesheet" href="../css/Home.css">
</head>
<body>

     <!--Informacion de todo el cliente-->  
  <div class="technician-profile">

    <!-- cover coloreado-->
    <div class="profile-cover">
     
    </div>

    <!-- header: avatar + nombre + categoría -->
    <div class="profile-header">
      <div class="profile-avatar" id="avatar"></div>
      <h1 class="profile-name" id="profile-name"></h1>
      <div class="profile-category" id="profile-category"></div>
    </div>


    <!--Descripcion -->
    <div class="profile-description">
      <div class="section-label">Sobre mí</div>
      <p id="profile-desc">Cargando...</p>
    </div>

    <!-- Informacion en tarjeta -->
    <div class="profile-info-card">
      <div class="info-card-title">Información</div>

      <div class="info-row">
        <div class="info-left">
          <div class="info-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
          </div>
          <span class="info-label">Zona</span>
        </div>
        <span class="info-value" id="info-zone">—</span>
      </div>

      <div class="info-row">
        <div class="info-left">
          <div class="info-icon">
            <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
          </div>
          <span class="info-label">Categoría</span>
        </div>
        <span class="info-value" id="info-category">—</span>
      </div>

      <div class="info-row">
        <div class="info-left">
          <div class="info-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <span class="info-label">Disponibilidad</span>
        </div>
        <span class="info-value primary" id="info-avail">—</span>
      </div>

    </div>

    <!-- BOTÓN -->
    <div class="profile-btn-wrap">
      <button class="profile-btn">Contactar</button>
    </div>

  </div>

  <!-- NAVIGATION -->
  <div class="bottom-nav">
    <div class="nav-item" onclick="history.back()">
      <svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><polyline points="9 21 9 12 15 12 15 21"/></svg>
      <span class="nav-label">Inicio</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span class="nav-label">Buscar</span>
    </div>
    <div class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="nav-label">Cuenta</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <span class="nav-label">Ajustes</span>
    </div>
  </div>

  <script src="../js/technician_info.js"> 
  </script>

</body>
</html>
