<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Buscar Técnicos — SahlaFix</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
 
  <link rel="stylesheet" href="../css/Home.css">
  <link rel="stylesheet" href="../css/Buscar.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">SahlaFix</div>
      <div class="header-search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="global-search" placeholder="Buscar técnicos, servicios..." autocomplete="off" spellcheck="false">
      </div>
    </div>
  </header>

  <div class="container">

    <!-- SEARCH HERO -->
    <div class="search-hero">
      <div class="search-hero-label">
      </div>
      <h1 class="search-hero-title">Encuentra al<br>profesional ideal</h1>

      <!-- BIG SEARCH BAR -->
      <div class="search-box">
        <div class="search-box-inner">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input
            type="text"
            id="search-input"
            placeholder="Nombre del técnico…"
            autocomplete="off"
            spellcheck="false"
          >
          <button class="search-clear" id="search-clear" aria-label="Limpiar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

      </div>

    <!-- RESULTS HEADER -->
    <div class="results-header" id="results-header" style="display:none">
      <div class="results-count" id="results-count"></div>
      <button class="results-clear-btn" id="results-clear">Limpiar</button>
    </div>

    <!-- CARDS GRID -->
    <div class="cards" id="results-grid"></div>

    <!-- INITIAL STATE -->
    <div class="state-block" id="state-initial">
      <div class="state-illustration">
        <svg viewBox="0 0 80 80" fill="none">
          <circle cx="36" cy="36" r="26" stroke="var(--primary-mid)" stroke-width="3"/>
          <circle cx="36" cy="36" r="14" stroke="var(--primary)" stroke-width="2.5" stroke-dasharray="4 3"/>
          <line x1="55" y1="55" x2="68" y2="68" stroke="var(--primary)" stroke-width="3" stroke-linecap="round"/>
          <circle cx="36" cy="30" r="6" fill="var(--primary-light)" stroke="var(--primary-mid)" stroke-width="1.5"/>
          <path d="M24 46c0-6.627 5.373-8 12-8s12 1.373 12 8" stroke="var(--primary-mid)" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <p class="state-title">Busca por nombre</p>
    </div>

    <!-- Estado al estar cargando-->
    <div class="state-block" id="state-loading" style="display:none">
      <div class="loader-ring">
        <svg viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="16" fill="none" stroke="var(--border)" stroke-width="3"/>
          <circle cx="20" cy="20" r="16" fill="none" stroke="var(--primary)" stroke-width="3"
            stroke-linecap="round" stroke-dasharray="30 70" class="spin-arc"/>
        </svg>
      </div>
      <p class="state-title">Buscando…</p>
    </div>

    <!--estado vacio -->
    <div class="state-block" id="state-empty" style="display:none">
      <div class="state-illustration empty">
        <svg viewBox="0 0 80 80" fill="none">
          <circle cx="40" cy="34" r="22" stroke="var(--border)" stroke-width="2.5"/>
          <path d="M29 34c0-6.075 4.925-11 11-11" stroke="var(--muted)" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="34" cy="31" r="2" fill="var(--muted)"/>
          <circle cx="46" cy="31" r="2" fill="var(--muted)"/>
          <path d="M33 40s2 2 7 2 7-2 7-2" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"/>
          <line x1="56" y1="56" x2="66" y2="66" stroke="var(--border)" stroke-width="3" stroke-linecap="round"/>
          <line x1="62" y1="60" x2="60" y2="62" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
      <p class="state-title">Sin resultados</p>
      <p class="state-sub">No encontramos ningún técnico con ese nombre.<br>Prueba con otro término.</p>
    </div>

    <!-- Estado de error -->
    <div class="state-block" id="state-error" style="display:none">
      <div class="state-illustration error">
        <svg viewBox="0 0 80 80" fill="none">
          <circle cx="40" cy="40" r="28" stroke="var(--border)" stroke-width="2.5"/>
          <path d="M40 25v18" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
          <circle cx="40" cy="51" r="2.5" fill="#EF4444"/>
        </svg>
      </div>
      <p class="state-title">Error de conexión</p>
      <p class="state-sub">No pudimos contactar el servidor.<br>Verifica tu conexión e inténtalo de nuevo.</p>
      <button class="retry-btn" id="retry-btn">Reintentar</button>
    </div>

  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <div class="nav-item" onclick="location.href='../auth/Home.html'">
    <svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><polyline points="9 21 9 12 15 12 15 21"/></svg>
      <span class="nav-label">Inicio</span>
    </div>
    <div class="nav-item active">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span class="nav-label">Buscar</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="nav-label">Cuenta</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <span class="nav-label">Ajustes</span>
    </div>
        <a href="../auth/Mapa.html" class="nav-item">
            <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
            <span class="nav-label">Mapa</span>
      </a>
          <a href="Chats.html" class="nav-item" style="text-decoration:none">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      <span class="nav-label">Chats</span>
    </a>
  </div>

  <script src="../js/buscador.js"></script>
</body>
</html>
