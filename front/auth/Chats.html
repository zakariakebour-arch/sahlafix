<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Chats — SahlaFix</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/Home.css">
  <link rel="icon" type="image/png" href="../assests/logo.png">
  <link rel="stylesheet" href="../css/Chats.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="logo">SahlaFix</div>
      <div class="chats-header-title">Chats</div>
    </div>
  </header>

  <div class="container">

    <!-- Estado cargando-->
    <div id="state-loading" class="state-block">
      <div class="loader-ring">
        <svg viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="16" fill="none" stroke="var(--border)" stroke-width="3"/>
          <circle cx="20" cy="20" r="16" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linecap="round" stroke-dasharray="30 70"/>
        </svg>
      </div>
      <p class="state-title">Cargando conversaciones…</p>
    </div>

    <!-- Estado vacio-->
    <div id="state-empty" class="state-block" style="display:none">
      <div class="state-illustration">
        <svg viewBox="0 0 80 80" fill="none">
          <rect x="12" y="16" width="56" height="40" rx="10" stroke="var(--primary-mid)" stroke-width="2.5"/>
          <path d="M24 56l4-8h24l4 8" stroke="var(--primary-mid)" stroke-width="2" stroke-linecap="round"/>
          <circle cx="32" cy="36" r="3" fill="var(--primary-mid)"/>
          <circle cx="40" cy="36" r="3" fill="var(--primary-mid)"/>
          <circle cx="48" cy="36" r="3" fill="var(--primary-mid)"/>
        </svg>
      </div>
      <p class="state-title">Sin conversaciones</p>
      <p class="state-sub">Aún no tienes mensajes.<br>Contacta a un técnico para empezar.</p>
    </div>

    <!-- Estado de error -->
    <div id="state-error" class="state-block" style="display:none">
      <div class="state-illustration">
        <svg viewBox="0 0 80 80" fill="none">
          <circle cx="40" cy="40" r="28" stroke="var(--border)" stroke-width="2.5"/>
          <path d="M40 25v18" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
          <circle cx="40" cy="51" r="2.5" fill="#EF4444"/>
        </svg>
      </div>
      <p class="state-title">Error de conexión</p>
      <p class="state-sub">No pudimos cargar tus chats.<br>Verifica tu conexión e inténtalo de nuevo.</p>
      <button class="retry-btn" id="retry-btn">Reintentar</button>
    </div>

    <!-- Lista de conversaciones -->
    <div id="chats-list" style="display:none"></div>

  </div>

  <!-- nav -->
  <div class="bottom-nav">

      <span class="nav-label">Inicio</span>
    </a>
    <a href="../auth/buscador.html" class="nav-item" style="text-decoration:none">

      <span class="nav-label">Buscar</span>

        </div>
