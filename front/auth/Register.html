<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SAHLAFIX - Crear Usuario</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/Register.css">
    <link rel="icon" type="image/png" href="../assests/logo.png">
  </style>
</head>

<body>
<div class="app">
  <main class="panel">
    <section class="wrap">
      <section class="card" aria-labelledby="title">
        
        <header class="header">
          <h1 id="title" class="title">Crear Usuario</h1>
        </header>

        <p class="subtitle">
          Elige el rol y completa los datos.
        </p>

        <form id="user-form" novalidate>
          <div class="group">
            <span class="label">Rol</span>

            <div class="segmented">
              <div class="thumb"></div>

              <button type="button"
                aria-pressed="true"
                aria-selected="true"
                id="role-cliente"
                data-role="cliente">
                Cliente
              </button>

              <button type="button"
                aria-pressed="false"
                aria-selected="false"
                id="role-tecnico"
                data-role="tecnico">
                Técnico
              </button>
            </div>
          </div>
          <div class="group">
            <div class="field">
              <label for="name" class="label">Nombre</label>
              <input id="name" type="text" placeholder="Nombre completo" required>
              <div id="err-name" class="error"></div>
            </div>

            <div class="field">
              <label for="email" class="label">Email</label>
              <input id="email" type="email" placeholder="correo@ejemplo.com" required>
              <div id="err-email" class="error"></div>
            </div>

            <div class="field">
              <label for="password" class="label">Contraseña</label>
              <input id="password" type="password" minlength="8" placeholder="Mínimo 8 caracteres" required>
              <div id="err-password" class="error"></div>
            </div>
          </div>

          <!-- CAMPOS DINÁMICOS TÉCNICO -->
          <div class="group expand" id="tecnico-section">
            <div class="inner">

              <div class="field">
                <label class="label">Teléfono</label>
                <input id="phone" type="text" placeholder="Ej: 0555 55 55 55">
              </div>

              <div class="field">
                <select id="wilaya" name="wilaya" required>
                    <option value="">Selecciona una wilaya</option>
                    <option value="Adrar">01 - Adrar</option>
                    <option value="Chlef">02 - Chlef</option>
                    <option value="Laghouat">03 - Laghouat</option>
                    <option value="Oum El Bouaghi">04 - Oum El Bouaghi</option>
                    <option value="Batna">05 - Batna</option>
                    <option value="Béjaïa">06 - Béjaïa</option>
                    <option value="Biskra">07 - Biskra</option>
                    <option value="Béchar">08 - Béchar</option>
                    <option value="Blida">09 - Blida</option>
                    <option value="Bouira">10 - Bouira</option>
                    <option value="Tamanrasset">11 - Tamanrasset</option>
                    <option value="Tébessa">12 - Tébessa</option>
                    <option value="Tlemcen">13 - Tlemcen</option>
                    <option value="Tiaret">14 - Tiaret</option>
                    <option value="Tizi Ouzou">15 - Tizi Ouzou</option>
                    <option value="Alger">16 - Alger</option>
                    <option value="Djelfa">17 - Djelfa</option>
                    <option value="Jijel">18 - Jijel</option>
                    <option value="Sétif">19 - Sétif</option>
                    <option value="Saïda">20 - Saïda</option>
                    <option value="Skikda">21 - Skikda</option>
                    <option value="Sidi Bel Abbès">22 - Sidi Bel Abbès</option>
                    <option value="Annaba">23 - Annaba</option>
                    <option value="Guelma">24 - Guelma</option>
                    <option value="Constantine">25 - Constantine</option>
                    <option value="Médéa">26 - Médéa</option>
                    <option value="Mostaganem">27 - Mostaganem</option>
                    <option value="M'Sila">28 - M'Sila</option>
                    <option value="Mascara">29 - Mascara</option>
                    <option value="Ouargla">30 - Ouargla</option>
                    <option value="Oran">31 - Oran</option>
                    <option value="El Bayadh">32 - El Bayadh</option>
                    <option value="Illizi">33 - Illizi</option>
                    <option value="Bordj Bou Arréridj">34 - Bordj Bou Arréridj</option>
                    <option value="Boumerdès">35 - Boumerdès</option>
                    <option value="El Tarf">36 - El Tarf</option>
                    <option value="Tindouf">37 - Tindouf</option>
                    <option value="Tissemsilt">38 - Tissemsilt</option>
                    <option value="El Oued">39 - El Oued</option>
                    <option value="Khenchela">40 - Khenchela</option>
                    <option value="Souk Ahras">41 - Souk Ahras</option>
                    <option value="Tipaza">42 - Tipaza</option>
                    <option value="Mila">43 - Mila</option>
                    <option value="Aïn Defla">44 - Aïn Defla</option>
                    <option value="Naâma">45 - Naâma</option>
                    <option value="Aïn Témouchent">46 - Aïn Témouchent</option>
                    <option value="Ghardaïa">47 - Ghardaïa</option>
                    <option value="Relizane">48 - Relizane</option>
                    <option value="Timimoun">49 - Timimoun</option>
                    <option value="Bordj Badji Mokhtar">50 - Bordj Badji Mokhtar</option>
                    <option value="Ouled Djellal">51 - Ouled Djellal</option>
                    <option value="Béni Abbès">52 - Béni Abbès</option>
                    <option value="In Salah">53 - In Salah</option>
                    <option value="In Guezzam">54 - In Guezzam</option>
                    <option value="Touggourt">55 - Touggourt</option>
                    <option value="Djanet">56 - Djanet</option>
                    <option value="El M'Ghair">57 - El M'Ghair</option>
                    <option value="El Meniaa">58 - El Meniaa</option>
                </select>
              </div>
              <div class="field">
                <select name="categorias" id="categorias">
                  <option value="">Selecciona tu categoria</option>
                  <option value=1>Electricista</option>
                  <option value=2>Fontanero</option>
                  <option value=3>Mecánico</option>
                </select>
              </div>
              <div class="field">
                <label class="label">Ciudad</label>
                <input id="city" type="text" placeholder="Ej: Bab Ezzouar">
              </div>

              <div class="field">
                <label class="label">Descripción</label>
                <textarea id="desc" placeholder="Descripcion del perfil"></textarea>
              </div>
            </div>
          </div>

          <div class="actions">
            <button class="btn" type="submit">Crear cuenta</button>
          </div>

        </form>
      </section>
    </section>
  </main>
  <!--Contenedor hero-->
  <aside class="hero"></aside>
  <!--Contenedor para animacion de mensaje que el usuario fue creado correctamente-->
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
</div>
<script src="../js/Register.js"></script>
</body>
</html>
