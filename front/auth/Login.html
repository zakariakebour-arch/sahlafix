<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SAHALFIX - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/Login.css">
    <link rel="icon" type="image/png" href="../assests/logo.png">
</head>

<body>

<div class="login-app">

  <section class="login-card">

    <h1 class="login-title">Iniciar Sesión</h1>
    <p class="login-subtitle">Accede a tu cuenta para continuar</p>

    <form id="login-form" novalidate>

      <div class="login-field">
        <label class="login-label">Email</label>
        <input id="email" type="email" placeholder="correo@ejemplo.com" required>
      </div>

      <div class="login-field">
        <label class="login-label">Contraseña</label>
        <input id="password" type="password" placeholder="Tu contraseña" required>
      </div>

      <button type="submit" class="login-btn">Entrar</button>

    </form>

  </section>

</div>

</body>
</html>
